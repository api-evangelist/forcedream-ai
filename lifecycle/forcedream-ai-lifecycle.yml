description: >-
  How ForceDream versions, deprecates and operates its surfaces. The API is unversioned beyond a /v1/ path
  prefix; change is communicated through a dated platform changelog (v38.70 current) and a semver MCP server
  (0.12.x). Deprecation is governed by a terms clause, not a published policy page or Sunset headers. The
  provider publishes an SLA table on its developer docs and simultaneously disclaims any uptime commitment in
  its terms and on its trust centre; both statements are recorded verbatim.
versioning:
  scheme: path prefix + dated platform releases
  mechanism: /v1/ path prefix on the API; no version header. Platform releases are numbered (v38.70) and dated on the changelog; MCP server and SDKs are semver.
  current: v1 (API); platform v38.70 (17 August 2026); MCP server 0.12.1 live / 0.12.2 npm; OpenAPI 0.1.0 (2026-07-12 snapshot)
  docs: https://www.forcedream.com/changelog
  notes: >-
    The changelog for v38.70 records "Two legacy execution endpoints retired; public documentation moved to the
    A2A paths first, so no instruction pointed at a removed route" — retirement happens, and is announced after
    the docs are moved.
