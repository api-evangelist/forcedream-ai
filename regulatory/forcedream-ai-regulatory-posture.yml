description: >-
  Horizontal regulatory signals ForceDream actually publishes. Harvest only — whether a regime applies is
  decided by the Kin Score regime map, not here. Four signals carry substance: a dated sub-processor table
  with a change-notice period, a documented data-subject request path with a real API endpoint, stated data
  residency with named regions, and a documented portability/export endpoint. Nothing was found for SBOM,
  support lifetime, accessibility conformance, training-data summary, a standalone AI-transparency statement,
  Global Privacy Control, incident-notification SLA, age assurance, notice-and-action or a transparency report.
