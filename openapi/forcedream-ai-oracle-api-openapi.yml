openapi: 3.2.0
info:
  title: ForceDream Data Oracle API
  version: 1.0.0
  description: 33 M2M data bridges. HTTP 402 + Stripe payment.
servers:
- url: https://YOUR-NGROK-URL.ngrok-free.app
tags:
- name: Oracle
paths:
  /v1/oracle/semantic_cache:
    post:
      operationId: semantic_cache
      summary: Cached LLM embeddings (£0.05)
      description: Returns HTTP 402 with payment link if no payment. Include X-Payment-Intent-Id after paying.
      parameters:
      - in: header
        name: X-Payment-Intent-Id
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resource_id:
                  type: string
      responses:
        '200':
          description: Data returned after payment
        '402':
          description: Payment required — see payment.payment_link
      tags:
      - Oracle
