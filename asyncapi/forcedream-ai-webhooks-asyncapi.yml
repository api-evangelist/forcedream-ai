      signupCreated: {$ref: '#/components/messages/signupCreated'}
      fraudBlocked: {$ref: '#/components/messages/fraudBlocked'}
operations:
  receiveForceDreamEvent:
    action: receive
    channel: {$ref: '#/channels/webhookEndpoint'}
    summary: Receive a ForceDream webhook event
    description: Verify X-ForceDream-Signature against HMAC-SHA256(body, secret) before trusting the payload.
    bindings:
      http:
        method: POST
        headers:
          type: object
          properties:
            X-ForceDream-Signature:
              type: string
              description: HMAC-SHA256 of the payload body using your webhook secret.
    messages:
      - {$ref: '#/channels/webhookEndpoint/messages/earnCompleted'}
      - {$ref: '#/channels/webhookEndpoint/messages/withdrawalInitiated'}
      - {$ref: '#/channels/webhookEndpoint/messages/withdrawalFailed'}
