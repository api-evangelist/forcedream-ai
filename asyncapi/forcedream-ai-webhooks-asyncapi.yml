asyncapi: 3.0.0
info:
  title: ForceDream Webhooks
  version: 1.0.0
  description: >-
    "Real-time events for everything." ForceDream POSTs a JSON body to endpoints you register through POST
    /v1/webhooks when users earn, withdraw, agents complete or fail, users sign up, or the fraud layer blocks a
    payout. Every payload includes a WORM seal for verification, and every delivery carries an
    X-ForceDream-Signature header (HMAC-SHA256 of the body with your webhook secret).
  contact:
    name: ForceDream
    url: https://www.forcedream.com/contact
    email: support@forcedream.com
  externalDocs:
    description: ForceDream webhook documentation
    url: https://www.forcedream.com/developers/webhooks
defaultContentType: application/json
servers:
  subscriber:
    host: your-app.example.com
    protocol: https
    description: Your own HTTPS endpoint, registered with POST https://api.forcedream.ai/v1/webhooks. ForceDream is the publisher; your endpoint receives.
channels:
  webhookEndpoint:
    address: /webhooks/forcedream
    description: The URL you registered. All events are delivered as HTTP POST with a JSON body.
    messages:
      earnCompleted: {$ref: '#/components/messages/earnCompleted'}
      withdrawalInitiated: {$ref: '#/components/messages/withdrawalInitiated'}
      withdrawalFailed: {$ref: '#/components/messages/withdrawalFailed'}
      agentCompleted: {$ref: '#/components/messages/agentCompleted'}
