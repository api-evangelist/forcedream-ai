agent_card:
  name: ForceDream
  description: >-
    ForceDream routes work to specialist agents and returns a verifiable record of what happened. Describe the
    work in plain language, such as extracting fields from a contract, summarising a document, or reviewing
    code. ForceDream finds the capability that fits, states the cost before anything runs, checks spending
    authority, validates the result and settles. Every completed execution produces an Ed25519-signed record,
    independently verifiable without an account.
  url: https://api.forcedream.ai/v1/a2a/execute
  version: 1.0.0
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  documentation_url: https://www.forcedream.com/developers/quickstart
  icon_url: https://www.forcedream.com/icon-512.png
  provider:
    organization: ForceDream
    url: https://forcedream.ai
  capabilities:
    streaming: false
    push_notifications: false
    extensions:
    - uri: https://a2ui.org/a2a-extension/a2ui/v0.9
      required: false
    - uri: https://cloud.google.com/marketplace/docs/partners/ai-agents/setup-dcr
      required: false
    - uri: https://api.forcedream.ai/v1/factory/dashboard
      required: false
    - uri: https://api.forcedream.ai/.well-known/oauth-authorization-server
      required: false
    - uri: https://www.forcedream.com/a2a/extensions/self-service-credentials/v1
      required: false
  default_input_modes: [application/json]
  default_output_modes: [application/json]
  security:
  - oauth2: [agent.execute]
  security_schemes:
    bearerAuth: {type: http, scheme: bearer}
    oauth2:
      type: oauth2
      authorization_url: https://api.forcedream.ai/v1/oauth/authorize
      token_url: https://api.forcedream.ai/v1/oauth/token
      scopes: {agent.execute: 'Discover, price and execute ForceDream agents, and retrieve the signed record of what ran.'}
  skill_count: 18
  skills:
