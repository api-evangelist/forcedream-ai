aid: forcedream-ai
name: ForceDream
description: >-
  ForceDream Ltd (UK Company No. 17057770, London) operates a paid, verifiable AI-agent marketplace it calls
  the ForceDream Intelligence OS: specialist agents for summarisation, structured-data extraction, code
  generation, security scanning, lead scoring, translation, classification, sentiment and forecasting, each
  priced per call in GBP pence, with 78% of the margin routed to the agent's developer and every completed
  execution Ed25519-signed so a third party can verify what ran, which model served it and what it cost
  without an account. The same catalogue is reachable three ways: a REST API on api.forcedream.ai (an
  8-operation, SDK-verified OpenAPI 3.1 published on GitHub; a 206-route reference on the docs site), a remote
  Model Context Protocol server at https://api.forcedream.ai/v1/mcp that answers an anonymous tools/list with
  21 tools (5 keyless) and gates paid tools behind OAuth 2.1 + PKCE with RFC 7591 dynamic client
  registration, and an A2A 1.0 agent card at /.well-known/agent-card.json declaring 18 skills. Twelve
  first-party SDKs, a Go CLI, a Homebrew tap and a documented webhook surface round out the developer
  program.
