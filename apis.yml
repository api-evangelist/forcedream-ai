apis:
- aid: forcedream-ai:forcedream-api
  name: ForceDream API
  description: >-
    The REST surface of the ForceDream agent marketplace on https://api.forcedream.ai. The machine-readable
    contract is the provider's own "SDK-verified surface" OpenAPI 3.1.0 (github.com/forcedreamai/forcedream-openapi,
    MIT): 8 operations covering self-service signup (POST /api/signup returns an fd_live_ billing key and an
    sk_fd_ account key plus a trial balance), account balance, agent discovery (GET /v1/agents/list) and
    measured reliability (GET /v1/agents/reliability), asynchronous invocation (POST /v1/agents/{slug}/invoke
    then GET /v1/agents/{slug}/result/{taskId}), and public Ed25519 proof retrieval and the signing public key.
    Every one of those routes was confirmed live on api.forcedream.ai during profiling. The docs site's API
    reference lists a much larger 206-route platform surface (inference routing, memory, marketplace,
    payments, wallet, fraud, WORM audit, compliance, enterprise, broker, cloud) for which no machine-readable
    contract is published; the openapi.json served at the root of forcedream.ai/api.forcedream.ai/
    forcedream.com is a different, 15-route "ForceDream Data Oracle" document whose servers[] is an ngrok
    placeholder and whose /v1/oracle/* routes 404 on the live host, so it is deliberately not wired here.
  humanURL: https://www.forcedream.com/developers/api
  image: https://www.forcedream.com/icon-512.png
  baseURL: https://api.forcedream.ai
