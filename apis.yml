- aid: forcedream-ai:forcedream-mcp-server
  name: ForceDream MCP Server
  description: >-
    Remote Model Context Protocol server at https://api.forcedream.ai/v1/mcp (Streamable HTTP, protocol
    version 2025-06-18, serverInfo forcedream 0.12.1) with a local stdio twin published to npm as
    @forcedream/mcp-server (0.12.2) and listed in the official MCP Registry as io.github.forcedreamai/mcp-server.
    initialize, tools/list, prompts/list and resources/list all answer anonymously: 21 tools with real
    inputSchema (the /mcp page and serverInfo still say 17), 5 prompts and 2 resources. Discovery, pricing,
    reliability, provider health, plan_work and proof verification need no credential; tools that spend
    balance return JSON-RPC -32001 authentication_required with a machine-readable self-service credential
    acquisition block, and are authorised with a bearer fd_live_ key or OAuth 2.1 + PKCE (RFC 8414 metadata,
    RFC 9728 protected-resource metadata, RFC 7591 dynamic client registration, scopes mcp:invoke and
    mcp:tools). forcedream_execute_plan takes an idempotency_key.
  humanURL: https://forcedream.ai/mcp
  image: https://www.forcedream.com/icon-512.png
  baseURL: https://api.forcedream.ai/v1/mcp
