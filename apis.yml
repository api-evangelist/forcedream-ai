- aid: forcedream-ai:forcedream-a2a-agent
  name: ForceDream A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: a signed (ES256 JWS, kid in /.well-known/jwks.json) agent card
    served from https://api.forcedream.ai/.well-known/agent-card.json and mirrored on forcedream.ai and
    at the legacy /.well-known/agent.json path, protocolVersion 1.0, JSONRPC transport, 18 skills (research:citation,
    coding, code:review, data:extraction, summarization, translation, classification, sentiment, sales:lead-scoring,
    compliance:audit, analytics:forecast and more). The JSON-RPC endpoint https://api.forcedream.ai/v1/a2a/execute
    answers message/send; per-agent cards live at /v1/.well-known/agents/{slug}/agent-card.json. The card
    declares an A2UI extension, a Gemini Enterprise dynamic-client-registration extension and a published
    self-service-credentials extension describing how an agent obtains a bearer key without a human step.
    Security is bearerAuth or oauth2 with scope agent.execute.
  humanURL: https://www.forcedream.com/a2a
  image: https://www.forcedream.com/icon-512.png
  baseURL: https://api.forcedream.ai/v1/a2a/execute
