  (github.com/forcedreamai/forcedream-mcp/src/*.ts) and the docs. Confidence per row.
purpose: >-
  Bind each agent-facing MCP tool to the REST operation that backs it, so a tool inherits the operation's real
  parameters/requestBody as its contract, and record where the two surfaces diverge. For ForceDream the
  divergence is large in one direction: the OpenAPI deliberately covers only the 8 routes the SDKs use, while
  the MCP server fans out to named-agent tools and to platform routes (fraud, embeddings, market data,
  provider health, plan/execute) that the docs describe in prose but no published contract covers.
