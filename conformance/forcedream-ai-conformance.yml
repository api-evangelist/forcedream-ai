      refresh_token], code_challenge_methods_supported [S256], token_endpoint_auth_methods [none,
      client_secret_post]; agent card securitySchemes.oauth2.flows.authorizationCode.
  - id: rfc8414
    name: OAuth 2.0 Authorization Server Metadata
    conforms: true
    evidence: well-known/forcedream-ai-oauth-authorization-server.json (issuer https://api.forcedream.ai).
  - id: rfc9728
    name: OAuth 2.0 Protected Resource Metadata
    conforms: true
    evidence: well-known/forcedream-ai-oauth-protected-resource.json — resource https://api.forcedream.ai/v1/mcp, authorization_servers, scopes_supported, bearer_methods_supported [header]. Served on the resource host itself.
  - id: rfc7591
    name: OAuth 2.0 Dynamic Client Registration
    conforms: true
    evidence: registration_endpoint https://api.forcedream.ai/v1/oauth/register in the AS metadata; the agent card's DCR extension states "Registration requires no pre-shared credential and no human step" and cites RFC 7591. (GET on the endpoint 404s; registration is POST-only and was not exercised.)
  - id: rfc7636
