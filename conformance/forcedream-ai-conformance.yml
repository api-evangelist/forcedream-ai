description: >-
  Standards ForceDream's published contracts declare, with the evidence location for each. The domain
  standards for an AI-agent marketplace are the agent protocols themselves — MCP and A2A — and both are
  declared in machine-readable form on the provider's own host, not merely claimed in prose. Compliance
  claims from the trust centre are recorded as the provider states them, including the two it explicitly
  says it does NOT hold.
standards:
  - id: mcp
    name: Model Context Protocol 2025-06-18
    conforms: true
    domain_standard: true
    evidence: >-
      initialize on https://api.forcedream.ai/v1/mcp returns protocolVersion "2025-06-18" with tools/resources/
      prompts capabilities; tools/list returns 21 tools each with a JSON Schema inputSchema (most with
      outputSchema and annotations). mcp/forcedream-ai-mcp-initialize.json, mcp/forcedream-ai-mcp-tools-list.json.
  - id: a2a
    name: Agent2Agent protocol 1.0
    conforms: true
    domain_standard: true
    evidence: >-
      /.well-known/agent-card.json on api.forcedream.ai and forcedream.ai — protocolVersion "1.0", capabilities
      object, skills array (18), preferredTransport JSONRPC, defaultInput/OutputModes, securitySchemes; the
      endpoint answers JSON-RPC message/send. Graded conformant in a2a/forcedream-ai-a2a.yml.
  - id: a2ui
    name: A2UI v0.9 (A2A extension)
    conforms: true
    evidence: capabilities.extensions[] uri https://a2ui.org/a2a-extension/a2ui/v0.9 with surface/action endpoints; GET /v1/a2ui/surface returns a v0.9 createSurface/updateComponents message list (probed 200).
  - id: oauth2
