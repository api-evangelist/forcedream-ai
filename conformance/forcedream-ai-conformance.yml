    name: JSON Web Key Set
    conforms: true
    evidence: /.well-known/jwks.json — EC P-256 ES256 key (kid b9ce5d84d3ca) and OKP Ed25519 EdDSA key (kid bc21b1928474).
  - id: jws-signed-agent-card
