description: >-
  First-party ForceDream client libraries and tools. ForceDream publishes twelve SDKs under one GitHub account
  (forcedreamai, "ForceDream", blog https://forcedream.ai), a Go CLI with a Homebrew tap, an MCP server, and a
  LangChain integration. Seven of the SDKs are on a public registry and all seven sit at 0.3.0 released
  2026-08-12/14, i.e. one coordinated release; five (Java, Kotlin, C#, Swift, Dart, Elixir) are source-only —
  their READMEs say so explicitly ("Not yet published to Maven Central"), and Maven Central, NuGet, pub.dev and
  hex.pm were each queried and returned 404. version/published are read from registry metadata; null means the
  registry has no record, not that the check was skipped. The MCP server package moves independently of the
  SDK set (0.12.2, 2026-08-21) and is the most recently released first-party package.
